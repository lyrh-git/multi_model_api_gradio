<!DOCTYPE html>
<html>
<head>
<style>
.card-container {
    position: relative;
    width: 400px;
    height: 500px;
    background: url('TF白麝香.png') no-repeat center/cover;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.title {
    position: absolute;
    top: 20px;
    left: 15px;
    font-family: 'PingFang SC', sans-serif;
    font-weight: 800;
    font-size: 24px;
    color: #ffffff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    transform: rotate(-3deg);
    letter-spacing: 1px;
}

.subtitle {
    position: absolute;
    bottom: 100px;
    right: 20px;
    font-family: 'Arial', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: #f5f5f5;
    text-align: right;
    line-height: 1.3;
    transform: rotate(2deg);
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 50%);
    padding: 6px 12px;
    border-radius: 3px;
}

.decor-line {
    position: absolute;
    bottom: 90px;
    right: 25px;
    width: 80px;
    height: 2px;
    background: #ffffff;
    transform: rotate(2deg);
}
</style>
</head>
<body>
<div class="card-container">
    <div class="title">TOM FORD白麝香｜行走的荷尔蒙💫</div>
    <div class="subtitle">「温暖白麝香｜高级伪体香」<br>连呼吸都变贵的秘密✨</div>
    <div class="decor-line"></div>
</div>
</body>
</html>
