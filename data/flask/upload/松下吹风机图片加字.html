<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.card {
  position: relative;
  width: 500px;
  height: 700px;
  background-image: url('松下吹风机.png');
  background-size: cover;
  font-family: 'PingFang SC', -apple-system, sans-serif;
}

.title {
  position: absolute;
  top: 15%;
  left: 8%;
  transform: rotate(-3deg);
  font-size: 32px;
  font-weight: 800;
  color: #fff;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  background: linear-gradient(45deg, #ff6b6b, #ff8e53);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.2;
}

.highlight {
  position: absolute;
  bottom: 22%;
  right: 10%;
  transform: rotate(2deg);
  font-size: 24px;
  color: #2d3436;
  background: rgba(255,255,255,0.9);
  padding: 8px 15px;
  border-radius: 15px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  font-weight: 600;
}

.emoji {
  font-size: 28px;
  vertical-align: middle;
}
</style>
</head>
<body>
<div class="card">
  <div class="title">黑科技护发！💧<br>吹干=做水疗✨</div>
  <div class="highlight">头皮模式⚡肌肤模式<br>一键切换の小心机🎯</div>
</div>
</body>
</html>
