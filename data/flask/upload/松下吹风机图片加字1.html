<!DOCTYPE html>
<html>
<head>
<style>
.card-container {
    width: 380px;
    height: 500px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    font-family: 'PingFang SC', Helvetica, Arial, sans-serif;
}

.background-image {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.gradient-overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, rgba(18,25,38,0.2) 0%, rgba(45,49,76,0.2) 100%);
}

.content {
    position: relative;
    padding: 28px;
    color: white;
}

.title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 25px;
    background: linear-gradient(45deg, #ff6b6b, #ff9f43);
    -webkit-background-clip: text;
    color: transparent;
}

.feature-list {
    list-style: none;
    padding: 0;
}

.feature-item {
    display: flex;
    align-items: center;
    margin-bottom: 18px;
    padding: 12px;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    backdrop-filter: blur(5px);
}

.icon {
    font-size: 24px;
    margin-right: 15px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0px); }
}

.brand-tag {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(255,255,255,0.15);
    padding: 8px 15px;
    border-radius: 20px;
    font-weight: 500;
    backdrop-filter: blur(5px);
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="card-container">
    <img src="1.png" class="background-image" alt="吹风机背景">
    <div class="gradient-overlay"></div>

    <div class="content">
        <h1 class="title">纳米水离子黑科技｜拯救炸毛星人</h1>

        <ul class="feature-list">
            <li class="feature-item">
                <div class="icon" style="background: #ff6b6b3d; color: #ff6b6b;">
                    <i class="fas fa-tint"></i>
                </div>
                <span>双倍纳米水离子 深度润养发丝</span>
            </li>

            <li class="feature-item">
                <div class="icon" style="background: #45d0ff33; color: #45d0ff;">
                    <i class="fas fa-bolt"></i>
                </div>
                <span>智能温控技术 速干不伤发</span>
            </li>

            <li class="feature-item">
                <div class="icon" style="background: #7bff8233; color: #7bff82;">
                    <i class="fas fa-leaf"></i>
                </div>
                <span>头皮护理模式 保持水油平衡</span>
            </li>

            <li class="feature-item">
                <div class="icon" style="background: #ff9f4333; color: #ff9f43;">
                    <i class="fas fa-heart"></i>
                </div>
                <span>日系极简美学 家居颜值担当</span>
            </li>
        </ul>

        <div class="brand-tag">
            <i class="fas fa-certificate"></i> Panasonic纳米护理
        </div>
    </div>
</div>
</body>
</html>
